name: "VEDA G1.7 integrated generic GGUF Supervisor Seccomp kernel QA"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veda-g17-integrated-portable
  cancel-in-progress: false

jobs:
  single-portable-build:
    if: github.repository == '168211681/model-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Build pinned portable CPU binary exactly once
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 168211681/model-check
          test "$GITHUB_REF" = refs/heads/main
          for command in cmake ninja git gcc g++ sha256sum tar; do command -v "$command"; done
          git init -q src
          git -C src remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C src fetch --depth 1 origin 224d94c02b502470071921da10e8bcee1160d539
          git -C src checkout -q --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = 224d94c02b502470071921da10e8bcee1160d539
          cmake -S src -B src/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=OFF -DGGML_CPU_REPACK=OFF \
            -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_AVX512=OFF \
            -DGGML_AVX_VNNI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF \
            -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_SSE42=OFF -DGGML_BMI2=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF
          for flag in GGML_NATIVE GGML_CPU_ALL_VARIANTS GGML_AVX GGML_AVX2 GGML_AVX512 GGML_FMA GGML_F16C GGML_SSE42 GGML_BMI2; do
            grep -q "^$flag:BOOL=OFF$" src/build/CMakeCache.txt
          done
          cmake --build src/build --target llama-completion --parallel 3
          test -x src/build/bin/llama-completion
          tar -C src/build/bin -czf veda-g17-cpu-generic.tar.gz .
          sha256sum veda-g17-cpu-generic.tar.gz > veda-g17-cpu-generic.tar.gz.sha256
          echo "G1.7 SAME_BINARY_GENERATION=PASS"
          sha256sum src/build/bin/llama-completion
          echo "G1.7 TRUST_G0=HOLD"

      - name: Upload immutable single-build artifact with 1-day retention
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veda-g17-portable-onebuild
          path: |
            veda-g17-cpu-generic.tar.gz
            veda-g17-cpu-generic.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error

  replay-on-two-host-images:
    if: github.repository == '168211681/model-check'
    needs: single-portable-build
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, ubuntu-22.04]
        slot: [1, 2, 3, 4]
    runs-on: "${{ matrix.host }}"
    timeout-minutes: 9
    env:
      MODEL_URL: https://huggingface.co/ggml-org/SmolLM2-135M-GGUF/resolve/1076b85d135017971845b19b8d07df1479155988/SmolLM2-135M-Q4_K_M.gguf
      MODEL_SHA256: e3131339bf4e8065265593d4fd8f7bb7ff2d3abff1edb5618aa1197b89cad9f5
    steps:
      - name: Download exact uploaded CPU-generic binary, not a rebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: veda-g17-portable-onebuild
          path: artifact

      - name: CPU vendor gate before model download and inference
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "168211681/model-check"
          test "$GITHUB_REF" = "refs/heads/main"
          vendor="$(awk -F: '/^vendor_id/{gsub(/^[ \t]+/,"",$2); print $2;exit}' /proc/cpuinfo)"
          cpu="$(awk -F: '/^model name/{gsub(/^[ \t]+/,"",$2); print $2;exit}' /proc/cpuinfo)"
          test -n "$vendor"
          echo "G1.7 HARDWARE_VENDOR=$vendor"
          echo "G1.7 HARDWARE_CPU=$cpu"
          echo "G1.7 HOST_LABEL=${{ matrix.host }}"
          echo "G1.7 HOST_SLOT=${{ matrix.slot }}"
          # Prioritize Intel while keeping one positive AMD baseline per host image.
          if test "$vendor" = GenuineIntel || test "${{ matrix.slot }}" = 1; then
            echo "RUN_NATIVE=true" >> "$GITHUB_ENV"
            echo "G1.7 CPU_GENERIC_SELECTED=YES"
          else
            echo "RUN_NATIVE=false" >> "$GITHUB_ENV"
            echo "G1.7 CPU_GENERIC_SELECTED=NO_AMD_SCOUT_ONLY"
          fi
          echo "G1.7 ROOTLESS_DELEGATION=NOT_TESTED"
          echo "G1.7 TRUST_G0=HOLD"

      - name: Verify artifact, CPU and pinned GGUF
        if: env.RUN_NATIVE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 168211681/model-check
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          for command in docker curl tar sha256sum; do command -v "$command" >/dev/null; done
          (cd artifact && sha256sum -c veda-g17-cpu-generic.tar.gz.sha256)
          mkdir -p portable model
          tar -xzf artifact/veda-g17-cpu-generic.tar.gz -C portable
          test -x portable/llama-completion
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 --output model/model.gguf "$MODEL_URL"
          printf '%s  %s\n' "$MODEL_SHA256" model/model.gguf | sha256sum --check --status
          chmod -R a+rX portable model
          echo "G1.7 HOST_OS=$RUNNER_OS"
          echo "G1.7 CPU_VENDOR=$(awk -F: '/^vendor_id/{print $2;exit}' /proc/cpuinfo)"
          echo "G1.7 CPU_MODEL=$(awk -F: '/^model name/{print $2;exit}' /proc/cpuinfo)"
          echo "G1.7 SAME_BINARY_ARCHIVE_SHA256=$(sha256sum artifact/veda-g17-cpu-generic.tar.gz | awk '{print $1}')"
          echo "G1.7 SAME_BINARY_EXE_SHA256=$(sha256sum portable/llama-completion | awk '{print $1}')"
          echo "G1.7 MODEL_INTEGRITY=PASS"

      - name: Fetch immutable Supervisor and portable Seccomp sources
        if: env.RUN_NATIVE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          for script in veda_g15_process_supervisor.py veda_g17_portable_seccomp_exec.py; do
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 \
              --output "tools/$script" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/tools/$script"
          done
          printf '%s  %s\n' b48f1fe8c5567bb4b4e23feb618c54f5aa5a3d0d85211d0324c2b5fbe9fac65e tools/veda_g15_process_supervisor.py | sha256sum --check --status
          python3 -S -m py_compile tools/veda_g15_process_supervisor.py tools/veda_g17_portable_seccomp_exec.py
          chmod -R a+rX tools
          sha256sum tools/*.py
          echo "G1.7 INTEGRATED_G15_G17_SOURCE_INTEGRITY=PASS"

      - name: Verify Seccomp 27-deny negative test after exec inside kernel-capped container
        if: env.RUN_NATIVE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          timeout 25s docker run --rm --network none \
            --memory 768m --memory-swap 768m --pids-limit 48 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --mount "type=bind,source=$root/tools,target=/tools,readonly" \
            --entrypoint /usr/bin/python3 \
            ghcr.io/ggml-org/llama.cpp:light@sha256:d1dac5128905d21f2ef7306a3bcbd509ef50dbe5b5b91c5f2812dd0d6f859b2c \
            -S /tools/veda_g15_process_supervisor.py \
            --max-rss-mb 200 --max-as-mb 3072 --max-processes 4 --timeout-s 12 -- \
            /usr/bin/python3 -S /tools/veda_g17_portable_seccomp_exec.py \
            --post-exec-selftest > g17-negative.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=Path("g17-negative.jsonl").read_text().splitlines()
          rows=[json.loads(line.partition("VEDA_SUPERVISOR_RESULT=")[2]) for line in x
                if line.startswith("VEDA_SUPERVISOR_RESULT=")]
          assert len(rows)==1,"Supervisor evidence missing"
          r=rows[0]
          assert r["decision"]=="exit_0" and r["child_exit"]==0 and r["alive_group_after"]==0,r
          assert "SECCOMP_PERSISTED_ACROSS_EXEC=PASS" in r["stdout_excerpt"],r
          assert "SECCOMP_POLICY_LOADED=27_DENIED_SYSCALLS" in r["stderr_excerpt"],r
          print("G1.7 INTEGRATED_NEGATIVE_SECCOMP_AND_SUPERVISOR=PASS")
          PY

      - name: Compare identical binary in networkless capped containers
        if: env.RUN_NATIVE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          for threads in 1 2; do
            for trial in 1 2; do
              timeout 65s docker run --rm --network none \
                --memory 768m --memory-swap 768m --pids-limit 48 \
                --cap-drop ALL --security-opt no-new-privileges \
                --user 65534:65534 --read-only \
                --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
                --mount "type=bind,source=$root/portable,target=/portable,readonly" \
                --mount "type=bind,source=$root/model,target=/model,readonly" \
                --env LD_LIBRARY_PATH=/portable \
                --entrypoint /portable/llama-completion \
                ghcr.io/ggml-org/llama.cpp:light@sha256:d1dac5128905d21f2ef7306a3bcbd509ef50dbe5b5b91c5f2812dd0d6f859b2c \
                --model /model/model.gguf \
                --prompt $'Capital city quiz:\nGermany: Berlin\nItaly: Rome\nSpain: Madrid\nFrance:' \
                --n-predict 24 --ctx-size 256 --threads "$threads" --threads-batch "$threads" \
                --temp 0 --seed 42 --no-display-prompt --no-conversation \
                > "inference-$threads-$trial.out" 2> "inference-$threads-$trial.err"
              test -s "inference-$threads-$trial.out"
              grep -q Paris "inference-$threads-$trial.out"
              printf "G1.7 REPLAY_THREADS_%s_TRIAL_%s_SHA256=" "$threads" "$trial"
              sha256sum "inference-$threads-$trial.out" | awk '{print $1}'
            done
            cmp "inference-$threads-1.out" "inference-$threads-2.out"
            echo "G1.7 REPLAY_THREADS_$threads=REPRODUCIBLE_WITHIN_HOST"
          done
          echo "G1.7 SINGLE_COMPILED_BINARY_CROSS_HOST_REPLAY=PASS_PER_HOST"
          echo "G1.7 CROSS_CPU_VENDOR_DETERMINISM=AWAIT_COMPARISON_OF_JOB_LOGS"
          echo "G1.7 GATED_REPLAY_COMPLETED=PASS"
          binary_sha="$(sha256sum portable/llama-completion | awk '{print $1}')"
          for threads in 1 2; do
            for trial in 1 2; do
              set +e
              timeout 65s docker run --rm --network none \
                --memory 768m --memory-swap 768m --pids-limit 48 \
                --cap-drop ALL --security-opt no-new-privileges \
                --user 65534:65534 --read-only \
                --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
                --mount "type=bind,source=$root/tools,target=/tools,readonly" \
                --mount "type=bind,source=$root/portable,target=/portable,readonly" \
                --mount "type=bind,source=$root/model,target=/model,readonly" \
                --env LD_LIBRARY_PATH=/portable \
                --env "VEDA_PORTABLE_SHA256=$binary_sha" \
                --entrypoint /usr/bin/python3 \
                ghcr.io/ggml-org/llama.cpp:light@sha256:d1dac5128905d21f2ef7306a3bcbd509ef50dbe5b5b91c5f2812dd0d6f859b2c \
                -S /tools/veda_g15_process_supervisor.py \
                --max-rss-mb 600 --max-as-mb 3072 --max-processes 8 --timeout-s 55 -- \
                /usr/bin/python3 -S /tools/veda_g17_portable_seccomp_exec.py \
                -- /portable/llama-completion \
                --model /model/model.gguf \
                --prompt 
          echo "G1.7 ROOTLESS_DELEGATION=NOT_TESTED"
          echo "G1.7 TRUST_G0=HOLD"
Capital city quiz:\nGermany: Berlin\nItaly: Rome\nSpain: Madrid\nFrance:' \
                --n-predict 24 --ctx-size 256 --threads "$threads" --threads-batch "$threads" \
                --temp 0 --seed 42 --no-display-prompt --no-conversation \
                > "g17-unified-$threads-$trial.jsonl" 2> "g17-unified-$threads-$trial.err"
              code=$?
              set -e
              if test "$code" -ne 0; then
                echo "G1.7 INTEGRATED_FAIL_CLOSED_CONTAINER_EXIT=$code"
                grep '^VEDA_SUPERVISOR_RESULT=' "g17-unified-$threads-$trial.jsonl" || true
                head -c 1200 "g17-unified-$threads-$trial.err" || true
                exit 1
              fi
              python3 - "$threads" "$trial" <<'PY'
          import json,sys
          from pathlib import Path
          t,n=sys.argv[1:]
          lines=Path(f"g17-unified-{t}-{n}.jsonl").read_text().splitlines()
          rr=[json.loads(line.partition("VEDA_SUPERVISOR_RESULT=")[2]) for line in lines
              if line.startswith("VEDA_SUPERVISOR_RESULT=")]
          assert len(rr)==1, "BLOCKED: invalid Supervisor evidence"
          r=rr[0]
          assert r["decision"]=="exit_0" and r["child_exit"]==0 and r["alive_group_after"]==0,r
          assert r["max_observed_processes"]<=8 and r["max_observed_rss_bytes"]<600*1024*1024,r
          assert "Paris" in r["stdout_excerpt"],r
          assert "PORTABLE_BINARY_INTEGRITY=PASS" in r["stderr_excerpt"],r
          assert "SECCOMP_POLICY_LOADED=27_DENIED_SYSCALLS" in r["stderr_excerpt"],r
          assert r["stdout_sha256"]=="d7a3611195b24f1246701c68beaa1a3a641b4b759607a45bb837b36294461c53",r
          print(f"G1.7 INTEGRATED_THREADS_{t}_TRIAL_{n}_SHA256={r['stdout_sha256']}")
          print(f"G1.7 INTEGRATED_THREADS_{t}_TRIAL_{n}_RSS_BYTES={r['max_observed_rss_bytes']}")
          PY
            done
          done
          echo "G1.7 INTEGRATED_CPU_VENDOR=$(awk -F: '/^vendor_id/{print $2;exit}' /proc/cpuinfo)"
          echo "G1.7 INTEGRATED_BINARY_SHA256=$binary_sha"
          echo "G1.7 INTEGRATED_SUPERVISOR_SECCOMP_KERNEL_GGUF=PASS_4_OF_4"
          echo "G1.7 TRUST_G0=HOLD"

          echo "G1.7 ROOTLESS_DELEGATION=NOT_TESTED"
          echo "G1.7 TRUST_G0=HOLD"
