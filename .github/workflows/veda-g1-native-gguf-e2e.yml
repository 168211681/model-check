name: "VEDA G1 Native GGUF E2E (model-check only)"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/veda-g1-native-gguf-e2e.yml

permissions:
  contents: read

concurrency:
  group: veda-g1-native-gguf-e2e
  cancel-in-progress: false

jobs:
  native-gguf-e2e:
    if: github.repository == '168211681/model-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LLAMA_COMMIT: 224d94c02b502470071921da10e8bcee1160d539
      MODEL_URL: https://huggingface.co/ggml-org/SmolLM2-135M-GGUF/resolve/1076b85d135017971845b19b8d07df1479155988/SmolLM2-135M-Q4_K_M.gguf
      MODEL_SHA256: e3131339bf4e8065265593d4fd8f7bb7ff2d3abff1edb5618aa1197b89cad9f5
    steps:
      - name: Scope, public-runner and no-write preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "168211681/model-check"
          case "$GITHUB_EVENT_NAME" in workflow_dispatch|push) ;; *) exit 1 ;; esac
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          echo "Scope: $GITHUB_REPOSITORY / standard ubuntu-24.04 / read-only token"
          echo "No deployments, no repository writes, no credentials."

      - name: Install Ubuntu-signed bubblewrap and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap ninja-build cmake g++ git ca-certificates curl
          command -v bwrap

      - name: Bubblewrap isolation preflight (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d -p /tmp veda-g1-stage.XXXXXX)"
          chmod 0755 "$stage_dir"
          printf 'VEDA_STAGE=%s\n' "$stage_dir" >> "$GITHUB_ENV"
          set +e
          timeout 15s sudo --non-interactive bwrap --unshare-all --die-with-parent \
            --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
            --ro-bind "$stage_dir" /tmp/work \
            --uid 65534 --gid 65534 --clearenv --setenv HOME /tmp --setenv LD_LIBRARY_PATH /tmp/work/bin --chdir /tmp/work \
            -- /usr/bin/test -r /tmp/work >"$RUNNER_TEMP/bwrap-preflight.log" 2>&1
          status=$?
          set -e
          if test "$status" -ne 0; then
            echo "Bubblewrap preflight denied (exit $status); no unsandboxed fallback."
            sed -n '1,40p' "$RUNNER_TEMP/bwrap-preflight.log"
            exit "$status"
          fi
          echo "Bubblewrap full namespace isolation available with unprivileged sandbox UID."

      - name: Verify sandbox UID, read-only stage and blocked egress
        shell: bash
        run: |
          set -euo pipefail
          host_netns="$(readlink /proc/self/ns/net)"
          cat > "$VEDA_STAGE/security_probe.py" <<'PY'
          import errno
          import os
          import socket

          assert os.geteuid() == 65534 and os.getegid() == 65534, "sandbox must run as nobody"
          assert os.readlink("/proc/self/ns/net") != os.environ["HOST_NETNS"], "network namespace not isolated"
          assert "GITHUB_TOKEN" not in os.environ and "GH_TOKEN" not in os.environ, "sensitive environment not cleared"
          with open("/proc/self/mountinfo", encoding="utf-8") as f:
              mounts = [line.split() for line in f if line.split()[4] == "/tmp/work"]
          assert len(mounts) == 1 and "ro" in mounts[0][5].split(","), "staged model mount not read-only"
          try:
              fd = os.open("/tmp/work/veda-no-write", os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          except OSError as exc:
              assert exc.errno in (errno.EROFS, errno.EACCES, errno.EPERM), f"unexpected write error: {exc}"
          else:
              os.close(fd)
              raise AssertionError("read-only stage was writable")
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
              sock.settimeout(3)
              try:
                  sock.connect(("1.1.1.1", 443))
              except OSError as exc:
                  assert getattr(exc, "errno", None) in (
                      errno.ENETUNREACH, errno.EHOSTUNREACH, errno.ENETDOWN,
                      errno.EACCES, errno.EPERM,
                  ), f"unexpected egress result: {exc!r}"
              else:
                  raise AssertionError("sandbox unexpectedly connected to the internet")
          print("SECURITY PASS: UID/GID=65534, isolated netns, no external egress, staged mount ro, environment cleared")
          PY
          chmod 0644 "$VEDA_STAGE/security_probe.py"
          timeout 20s sudo --non-interactive bwrap --unshare-all --die-with-parent \
            --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
            --ro-bind "$VEDA_STAGE" /tmp/work \
            --uid 65534 --gid 65534 --clearenv \
            --setenv HOME /tmp --setenv HOST_NETNS "$host_netns" --chdir /tmp/work \
            /usr/bin/python3 /tmp/work/security_probe.py

      - name: Checkout pinned upstream llama.cpp without checkout action
        shell: bash
        run: |
          set -euo pipefail
          git init -q llama-src
          git -C llama-src remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama-src fetch --depth 1 origin "$LLAMA_COMMIT"
          git -C llama-src checkout -q --detach FETCH_HEAD
          test "$(git -C llama-src rev-parse HEAD)" = "$LLAMA_COMMIT"
          echo "Pinned upstream commit: $LLAMA_COMMIT"

      - name: Build native CPU-only llama-completion
        shell: bash
        run: |
          set -euo pipefail
          cmake -S llama-src -B llama-src/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build llama-src/build --target llama-completion --parallel 4
          test -x llama-src/build/bin/llama-completion
          sha256sum llama-src/build/bin/llama-completion
          sha256sum "$(command -v bwrap)"

      - name: Download Apache-2.0 GGUF and enforce upstream SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 --output native-model.gguf "$MODEL_URL"
          printf "%s  %s\n" "$MODEL_SHA256" native-model.gguf | sha256sum --check --status
          test "$(stat -c %s native-model.gguf)" -gt 10000000
          echo "GGUF SHA-256 verified: $MODEL_SHA256"

      - name: Native GGUF inference x2, semantic and deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          cp -a llama-src/build/bin "$VEDA_STAGE/bin"
          cp native-model.gguf "$VEDA_STAGE/native-model.gguf"
          chmod -R a+rX "$VEDA_STAGE"
          test -x "$VEDA_STAGE/bin/llama-completion"
          test -r "$VEDA_STAGE/native-model.gguf"
          semantic_fail=0
          for attempt in 1 2; do
            output="$RUNNER_TEMP/veda-native-output-$attempt.txt"
            diagnostics="$RUNNER_TEMP/veda-native-diagnostics-$attempt.txt"
            set +e
            timeout 120s sudo --non-interactive bwrap --unshare-all --die-with-parent \
              --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
              --ro-bind "$VEDA_STAGE" /tmp/work \
              --uid 65534 --gid 65534 --clearenv \
              --setenv HOME /tmp --setenv LD_LIBRARY_PATH /tmp/work/bin --chdir /tmp/work \
              /tmp/work/bin/llama-completion \
              --model /tmp/work/native-model.gguf \
              --prompt $'Capital city quiz:\\nGermany: Berlin\\nItaly: Rome\\nSpain: Madrid\\nFrance:' \
              --n-predict 24 --ctx-size 256 --threads 2 \
              --temp 0 --seed 42 --no-display-prompt --no-conversation \
              >"$output" 2>"$diagnostics"
            status=$?
            set -e
            if test "$status" -ne 0; then
              echo "Native inference attempt $attempt failed (exit $status); no unsandboxed fallback"
              sed -n '1,50p' "$diagnostics"
              exit "$status"
            fi
            test -s "$output"
            if grep -Eiq '(^|[^[:alpha:]])Paris([^[:alpha:]]|$)' "$output"; then
              echo "SEMANTIC PASS (attempt $attempt): Paris was generated, not present in prompt"
            else
              echo "SEMANTIC FAIL (attempt $attempt): Paris absent"
              head -c 220 "$output"
              printf '\\n'
              semantic_fail=1
            fi
            echo "Native attempt $attempt bytes: $(wc -c < "$output")"
            sha256sum "$output"
          done
          if cmp -s "$RUNNER_TEMP/veda-native-output-1.txt" "$RUNNER_TEMP/veda-native-output-2.txt"; then
            echo "REPRODUCIBILITY PASS: output bytes identical 2/2"
            reproduce_result=PASS
          else
            echo "REPRODUCIBILITY FAIL: outputs differ despite deterministic settings"
            reproduce_result=FAIL
          fi
          if test "$semantic_fail" -eq 0; then
            semantic_result=PASS
          else
            semantic_result=FAIL
          fi
          {
            echo '## VEDA G1 Native GGUF Hardening (model-check only)'
            echo '| Check | Result |'
            echo '|---|---|'
            echo '| Isolated bubblewrap sandbox | PASS |'
            echo '| Model SHA-256 | PASS |'
            echo "| Semantic answer: Paris (not given in prompt) | $semantic_result |"
            echo "| Deterministic outputs (2/2) | $reproduce_result |"
            echo '| Trust G0 | HOLD (unchanged) |'
          } >> "$GITHUB_STEP_SUMMARY"
          if test "$semantic_result" != PASS || test "$reproduce_result" != PASS; then
            echo "QUALITY GATE FAIL: semantic=$semantic_result reproducibility=$reproduce_result"
            exit 1
          fi
          echo "NATIVE GGUF HARDENING PASS: semantic=$semantic_result reproducibility=$reproduce_result sandbox=isolated"

      - name: Report reproducibility pins (even on failure)
        if: always()
        shell: bash
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "llama.cpp commit: $LLAMA_COMMIT"
          echo "GGUF expected SHA-256: $MODEL_SHA256"
          echo "Review-only test; NOT VEDA Canonical Source or Governance Gate."
