name: "VEDA G1 Native GGUF E2E (model-check only)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veda-g1-native-gguf-e2e
  cancel-in-progress: false

jobs:
  native-gguf-e2e:
    if: github.repository == '168211681/model-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LLAMA_COMMIT: 224d94c02b502470071921da10e8bcee1160d539
      MODEL_URL: https://huggingface.co/ggml-org/SmolLM2-135M-GGUF/resolve/1076b85d135017971845b19b8d07df1479155988/SmolLM2-135M-Q4_K_M.gguf
      MODEL_SHA256: e3131339bf4e8065265593d4fd8f7bb7ff2d3abff1edb5618aa1197b89cad9f5
    steps:
      - name: Scope, public-runner and no-write preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "168211681/model-check"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          echo "Scope: $GITHUB_REPOSITORY / standard ubuntu-24.04 / read-only token"
          echo "No deployments, no repository writes, no credentials."

      - name: Install Ubuntu-signed bubblewrap and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap libseccomp2 ninja-build cmake g++ git ca-certificates curl
          command -v bwrap

      - name: Generate Seccomp BPF and restricted launcher
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/g13-filter.py" <<'PY'
          import ctypes, ctypes.util, errno, os, platform, sys
          assert platform.machine() == "x86_64", "unexpected architecture"
          name = ctypes.util.find_library("seccomp")
          assert name, "libseccomp missing"
          lib = ctypes.CDLL(name, use_errno=True)
          lib.seccomp_init.argtypes = [ctypes.c_uint32]
          lib.seccomp_init.restype = ctypes.c_void_p
          lib.seccomp_syscall_resolve_name.argtypes = [ctypes.c_char_p]
          lib.seccomp_syscall_resolve_name.restype = ctypes.c_int
          lib.seccomp_rule_add.argtypes = [ctypes.c_void_p, ctypes.c_uint32, ctypes.c_int, ctypes.c_uint]
          lib.seccomp_rule_add.restype = ctypes.c_int
          lib.seccomp_export_bpf.argtypes = [ctypes.c_void_p, ctypes.c_int]
          lib.seccomp_export_bpf.restype = ctypes.c_int
          lib.seccomp_release.argtypes = [ctypes.c_void_p]
          lib.seccomp_release.restype = None
          deny = (
              "socket", "socketpair", "ptrace", "mount", "umount2", "setns",
              "unshare", "bpf", "perf_event_open", "keyctl", "add_key",
              "request_key", "kexec_load", "finit_module", "init_module",
              "delete_module", "process_vm_readv", "process_vm_writev",
              "userfaultfd", "open_by_handle_at", "reboot", "swapon", "swapoff",
          )
          # Default-ALLOW + explicit high-risk denial; not a full syscall allowlist.
          ctx = lib.seccomp_init(0x7FFF0000)
          assert ctx, "seccomp_init failed"
          try:
              for syscall in deny:
                  nr = lib.seccomp_syscall_resolve_name(syscall.encode("ascii"))
                  assert nr >= 0, f"unresolved syscall {syscall}"
                  rc = lib.seccomp_rule_add(ctx, 0x00050000 | errno.EPERM, nr, 0)
                  assert rc == 0, f"failed filter rule {syscall}: {rc}"
              with open(sys.argv[1], "wb") as out:
                  rc = lib.seccomp_export_bpf(ctx, out.fileno())
                  assert rc == 0, f"BPF export failed: {rc}"
          finally:
              lib.seccomp_release(ctx)
          size = os.stat(sys.argv[1]).st_size
          assert size >= 128 and size % 8 == 0, "invalid BPF length"
          print(f"G1.3 SECCOMP BPF READY: {len(deny)} denied syscalls; {size} bytes")
          PY
          cat > "$RUNNER_TEMP/g13-launch.py" <<'PY'
          import os, sys
          if len(sys.argv) < 5:
              raise SystemExit("invalid launcher arguments")
          policy, stage, host_ns, *cmd = sys.argv[1:]
          if not (stage.startswith("/tmp/veda-g1-stage.") and os.path.isdir(stage) and cmd):
              raise SystemExit("invalid sandbox stage or command")
          fd = os.open(policy, os.O_RDONLY)
          os.dup2(fd, 3, inheritable=True)
          if fd != 3:
              os.close(fd)
          os.set_inheritable(3, True)
          args = [
              "/usr/bin/bwrap", "--seccomp", "3",
              "--unshare-all", "--die-with-parent", "--new-session", "--cap-drop", "ALL",
              "--tmpfs", "/",
              "--ro-bind", "/usr", "/usr",
              "--symlink", "usr/bin", "/bin", "--symlink", "usr/lib", "/lib",
              "--symlink", "usr/lib64", "/lib64",
              "--dev", "/dev", "--proc", "/proc", "--tmpfs", "/tmp",
              "--dir", "/etc", "--ro-bind", "/etc/ld.so.cache", "/etc/ld.so.cache",
              "--ro-bind", stage, "/tmp/work",
              "--uid", "65534", "--gid", "65534", "--clearenv",
              "--setenv", "HOME", "/tmp",
              "--setenv", "HOST_NETNS", host_ns,
              "--setenv", "LD_LIBRARY_PATH", "/tmp/work/bin",
              "--chdir", "/tmp/work",
              "--", *cmd
          ]
          os.execv("/usr/bin/bwrap", args)
          PY
          /usr/bin/python3 "$RUNNER_TEMP/g13-filter.py" "$RUNNER_TEMP/g13-seccomp.bpf"
          sha256sum "$RUNNER_TEMP/g13-seccomp.bpf"

      - name: Seccomp-filtered Bubblewrap preflight (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d -p /tmp veda-g1-stage.XXXXXX)"
          chmod 0755 "$stage_dir"
          printf 'VEDA_STAGE=%s\n' "$stage_dir" >> "$GITHUB_ENV"
          set +e
          timeout 15s sudo --non-interactive /usr/bin/python3 \
            "$RUNNER_TEMP/g13-launch.py" "$RUNNER_TEMP/g13-seccomp.bpf" \
            "$stage_dir" "$(readlink /proc/self/ns/net)" /usr/bin/test -r /tmp/work \
            >"$RUNNER_TEMP/bwrap-preflight.log" 2>&1
          result=$?
          set -e
          if test "$result" -ne 0; then
            echo "Seccomp sandbox preflight failed ($result); no unsandboxed fallback"
            sed -n '1,45p' "$RUNNER_TEMP/bwrap-preflight.log"
            exit "$result"
          fi
          echo "G1.3 SECCOMP PREFLIGHT PASS"

      - name: Seccomp denial and sandbox isolation negative tests
        shell: bash
        run: |
          set -euo pipefail
          cat > "$VEDA_STAGE/g13_probe.py" <<'PY'
          import errno, os, socket
          assert os.geteuid() == 65534 and os.getegid() == 65534
          assert os.readlink("/proc/self/ns/net") != os.environ["HOST_NETNS"]
          assert "GITHUB_TOKEN" not in os.environ and "GH_TOKEN" not in os.environ
          status = {}
          with open("/proc/self/status", encoding="utf-8") as f:
              for line in f:
                  if ":" in line:
                      key, value = line.split(":", 1)
                      status[key] = value.strip()
          assert status.get("Seccomp") == "2", f"seccomp mode {status.get('Seccomp')}"
          assert int(status.get("CapEff", "-1"), 16) == 0, "effective caps not dropped"
          forbidden = ("/home", "/root", "/var", "/run", "/mnt", "/opt",
                       "/workspace", "/etc/passwd", "/etc/shadow", "/etc/hosts")
          assert not [p for p in forbidden if os.path.lexists(p)], "host paths exposed"
          with open("/proc/self/mountinfo", encoding="utf-8") as f:
              entries = [line.split() for line in f]
          root = [m for m in entries if m[4] == "/"]
          usr = [m for m in entries if m[4] == "/usr"]
          work = [m for m in entries if m[4] == "/tmp/work"]
          assert len(root) == 1 and root[0][root[0].index("-")+1] == "tmpfs"
          assert len(usr) == 1 and "ro" in usr[0][5].split(",")
          assert len(work) == 1 and "ro" in work[0][5].split(",")
          try:
              fd = os.open("/tmp/work/deny-write", os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          except OSError as e:
              assert e.errno in (errno.EPERM, errno.EACCES, errno.EROFS), e
          else:
              os.close(fd)
              raise AssertionError("read-only model stage writable")
          try:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          except OSError as e:
              assert e.errno == errno.EPERM, f"socket() not blocked by Seccomp: {e}"
          else:
              sock.close()
              raise AssertionError("socket syscall unexpectedly permitted")
          print("G1.3 SECURITY PASS: seccomp=2, socket() EPERM, caps=0, blocked egress, ro mounts, isolated netns")
          PY
          chmod 0644 "$VEDA_STAGE/g13_probe.py"
          timeout 20s sudo --non-interactive /usr/bin/python3 \
            "$RUNNER_TEMP/g13-launch.py" "$RUNNER_TEMP/g13-seccomp.bpf" \
            "$VEDA_STAGE" "$(readlink /proc/self/ns/net)" /usr/bin/python3 /tmp/work/g13_probe.py

      - name: Checkout pinned upstream llama.cpp without checkout action
        shell: bash
        run: |
          set -euo pipefail
          git init -q llama-src
          git -C llama-src remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama-src fetch --depth 1 origin "$LLAMA_COMMIT"
          git -C llama-src checkout -q --detach FETCH_HEAD
          test "$(git -C llama-src rev-parse HEAD)" = "$LLAMA_COMMIT"
          echo "Pinned upstream commit: $LLAMA_COMMIT"

      - name: Build native CPU-only llama-completion
        shell: bash
        run: |
          set -euo pipefail
          cmake -S llama-src -B llama-src/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build llama-src/build --target llama-completion --parallel 4
          test -x llama-src/build/bin/llama-completion
          sha256sum llama-src/build/bin/llama-completion
          sha256sum "$(command -v bwrap)"

      - name: Download Apache-2.0 GGUF and enforce upstream SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 --output native-model.gguf "$MODEL_URL"
          printf "%s  %s\n" "$MODEL_SHA256" native-model.gguf | sha256sum --check --status
          test "$(stat -c %s native-model.gguf)" -gt 10000000
          echo "GGUF SHA-256 verified: $MODEL_SHA256"

      - name: Seccomp-protected GGUF inference x2, semantic and deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          cp -a llama-src/build/bin "$VEDA_STAGE/bin"
          cp native-model.gguf "$VEDA_STAGE/native-model.gguf"
          chmod -R a+rX "$VEDA_STAGE"
          test -x "$VEDA_STAGE/bin/llama-completion"
          test -r "$VEDA_STAGE/native-model.gguf"
          semantic_fail=0
          for attempt in 1 2; do
            output="$RUNNER_TEMP/veda-native-output-$attempt.txt"
            diagnostics="$RUNNER_TEMP/veda-native-diagnostics-$attempt.txt"
            set +e
            timeout 120s sudo --non-interactive /usr/bin/python3 \
              "$RUNNER_TEMP/g13-launch.py" "$RUNNER_TEMP/g13-seccomp.bpf" \
              "$VEDA_STAGE" "$(readlink /proc/self/ns/net)" \
              /tmp/work/bin/llama-completion \
              --model /tmp/work/native-model.gguf \
              --prompt $'Capital city quiz:\nGermany: Berlin\nItaly: Rome\nSpain: Madrid\nFrance:' \
              --n-predict 24 --ctx-size 256 --threads 2 \
              --temp 0 --seed 42 --no-display-prompt --no-conversation \
              >"$output" 2>"$diagnostics"
            status=$?
            set -e
            if test "$status" -ne 0; then
              echo "Native inference attempt $attempt failed (exit $status); no unsandboxed fallback"
              sed -n '1,50p' "$diagnostics"
              exit "$status"
            fi
            test -s "$output"
            if grep -Eiq '(^|[^[:alpha:]])Paris([^[:alpha:]]|$)' "$output"; then
              echo "SEMANTIC PASS (attempt $attempt): Paris was generated, not present in prompt"
            else
              echo "SEMANTIC FAIL (attempt $attempt): Paris absent"
              head -c 220 "$output"
              printf '\\n'
              semantic_fail=1
            fi
            echo "Native attempt $attempt bytes: $(wc -c < "$output")"
            sha256sum "$output"
          done
          if cmp -s "$RUNNER_TEMP/veda-native-output-1.txt" "$RUNNER_TEMP/veda-native-output-2.txt"; then
            echo "REPRODUCIBILITY PASS: output bytes identical 2/2"
            reproduce_result=PASS
          else
            echo "REPRODUCIBILITY FAIL: outputs differ despite deterministic settings"
            reproduce_result=FAIL
          fi
          if test "$semantic_fail" -eq 0; then
            semantic_result=PASS
          else
            semantic_result=FAIL
          fi
          {
            echo '## VEDA G1 Native GGUF Hardening (model-check only)'
            echo '| Check | Result |'
            echo '|---|---|'
            echo '| Isolated bubblewrap sandbox | PASS |'
            echo '| Model SHA-256 | PASS |'
            echo "| Semantic answer: Paris (not given in prompt) | $semantic_result |"
            echo "| Deterministic outputs (2/2) | $reproduce_result |"
            echo '| Trust G0 | HOLD (unchanged) |'
          } >> "$GITHUB_STEP_SUMMARY"
          if test "$semantic_result" != PASS || test "$reproduce_result" != PASS; then
            echo "QUALITY GATE FAIL: semantic=$semantic_result reproducibility=$reproduce_result"
            exit 1
          fi
          echo "NATIVE GGUF HARDENING PASS: semantic=$semantic_result reproducibility=$reproduce_result sandbox=isolated"

      - name: Report reproducibility pins (even on failure)
        if: always()
        shell: bash
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "llama.cpp commit: $LLAMA_COMMIT"
          echo "GGUF expected SHA-256: $MODEL_SHA256"
          echo "Review-only test; NOT VEDA Canonical Source or Governance Gate."
